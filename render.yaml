services:
  - type: web
    name: sigecoim-api
    runtime: node
    plan: free
    buildCommand: pnpm install
    startCommand: pnpm start
    envVars:
      - key: PORT
        value: 3003
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
